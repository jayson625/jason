<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World!</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-xl shadow-md p-6">
    <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Welcome to my Website</h1>
    
    <form class="space-y-5">
      <div class="flex items-center gap-2">
        <input type="checkbox" id="agree" class="h-4 w-4 rounded border-gray-300 text-blue-600">
        <label for="agree" class="text-sm font-medium text-gray-700">Agree</label>
      </div>

      <div class="flex flex-col gap-1">
        <label for="date" class="text-sm font-medium text-gray-700">Pick a date</label>
        <input type="date" id="date" class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="flex flex-col gap-1">
        <label for="color" class="text-sm font-medium text-gray-700">Pick a color</label>
        <input type="color" id="color" class="h-10 w-full rounded-lg border border-gray-300 p-1 cursor-pointer">
      </div>
    </form>
  </div>

</body>
</html
